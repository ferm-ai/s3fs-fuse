name: Build .deb

on:
  push:
    branches:
      - docker-build
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t s3fs-build .

      - name: Extract .deb from container
        run: |
          docker create --name s3fs-temp s3fs-build
          docker cp s3fs-temp:/s3fs-fuse/s3fs-fuse_1.97-1-agentwork_amd64.deb .
          docker rm s3fs-temp

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: s3fs-fuse_1.97-1-agentwork_amd64
          path: "*.deb"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete existing release if it exists
          gh release delete v1.97-1-agentwork --yes || true

          # Create new release with the .deb
          gh release create v1.97-1-agentwork \
            --title "s3fs-fuse 1.97-1-agentwork (amd64)" \
            --notes "Pre-built amd64 .deb package with fix for \`allow_other\` + \`compat_dir\` uid/gid issue.

          ## Install on Debian trixie (amd64)

          \`\`\`bash
          wget https://github.com/ferm-ai/s3fs-fuse/releases/download/v1.97-1-agentwork/s3fs-fuse_1.97-1-agentwork_amd64.deb
          sudo apt-get install -y ./s3fs-fuse_1.97-1-agentwork_amd64.deb
          \`\`\`
          " \
            s3fs-fuse_1.97-1-agentwork_amd64.deb
